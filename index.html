<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Blocks</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <button id="home-btn" title="Go to Main Menu">🏠</button>
            <div id="score-container">
                Score: <span id="score">0</span>
            </div>
        </header>
        <div id="title-screen" class="screen active">
            <h1 class="title-header">Merge <input type="text" id="theme-input" placeholder="Blocks..." autocomplete="off"></h1>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-difficulty="easy">Easy</button>
                <button class="difficulty-btn" data-difficulty="medium">Medium</button>
                <button class="difficulty-btn" data-difficulty="hard">Hard</button>
                <button class="difficulty-btn" data-difficulty="zen">Zen</button>
            </div>
            <div class="replay-menu-container">
                <button id="replay-menu-btn" class="replay-menu-btn">View Replays</button>
            </div>
        </div>
        <div id="replay-menu-screen" class="screen">
            <div id="replay-menu-container">
                <h2>Replay Gallery</h2>
                <div id="replay-gallery">
                    <p id="loading-replays-message">Loading replays...</p>
                    <div id="replay-list"></div>
                </div>
                <div id="replay-menu-controls">
                    <button id="watch-selected-replay-btn" style="display: none;">Watch Selected Replay</button>
                    <div id="continue-with-images-section" style="display: none;">
                        <h3>Continue with Same Images</h3>
                        <div class="difficulty-buttons">
                            <button class="continue-difficulty-btn" data-difficulty="easy">Easy</button>
                            <button class="continue-difficulty-btn" data-difficulty="medium">Medium</button>
                            <button class="continue-difficulty-btn" data-difficulty="hard">Hard</button>
                            <button class="continue-difficulty-btn" data-difficulty="zen">Zen</button>
                        </div>
                    </div>
                    <button id="back-to-home-btn">Back to Menu</button>
                </div>
                <div id="replay-menu-board-wrapper" style="display: none;">
                    <div id="replay-menu-board"></div>
                    <div id="replay-menu-status">Playing Replay...</div>
                </div>
            </div>
        </div>
        <div id="game-screen" class="screen">
            <div id="game-container">
                <div id="hourglass-container">
                    <canvas id="hourglass-canvas"></canvas>
                </div>
                <div id="game-board-wrapper">
                    <div id="game-board"></div>
                    <div id="game-overlay"></div>
                </div>
                <div id="combinations-container">
                    <h3>Possible Merges</h3>
                    <ul id="combinations-list"></ul>
                </div>
            </div>
        </div>
        <div id="replay-screen" class="screen">
            <div id="replay-container">
                <h2>Game Over! Final Score: <span id="final-score">0</span></h2>
                <div id="replay-controls">
                    <button id="watch-replay-btn">Watch Replay</button>
                    <button id="restart-with-images-btn">Restart with Same Images</button>
                    <button id="new-game-btn">New Game</button>
                </div>
                <div id="replay-board-wrapper" style="display: none;">
                    <div id="replay-board"></div>
                    <div id="replay-status">Playing Replay...</div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
